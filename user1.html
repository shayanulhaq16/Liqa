<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liqa — Ayaan</title>
  <link rel="stylesheet" href="user1.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <main class="app">
    <aside class="sidebar">
      <header class="side-top"><a class="logo" href="#">L<span>iqa</span></a><button class="round-icon"
          aria-label="New chat">＋</button></header>
      <label class="search"><span>⌕</span><input type="search" placeholder="Search or start a new chat"
          aria-label="Search chats"></label>
      <div class="filter-row"><span class="filter active">All</span><span class="filter">Unread</span><span
          class="filter">Favorites</span></div>
      <div class="chat-list">
        <a class="chat-item selected" href="#">
          <div class="avatar contact">A<i></i></div>
          <div class="chat-info">
            <div class="chat-line"><strong>Ayaan</strong><time>10:26 AM</time></div>
            <div class="preview-line"><span>Socha tumse baat kar loon 😄</span><b class="unread">2</b></div>
          </div>
        </a>
        <a class="chat-item" href="#">
          <div class="avatar avatar-two">S</div>
          <div class="chat-info">
            <div class="chat-line"><strong>Sana</strong><time>Yesterday</time></div>
            <div class="preview-line"><span>Voice message</span></div>
          </div>
        </a>
        <a class="chat-item" href="#">
          <div class="avatar avatar-three">F</div>
          <div class="chat-info">
            <div class="chat-line"><strong>Family Group</strong><time>Yesterday</time></div>
            <div class="preview-line"><span>Ammi: ghar kab aa rahe ho?</span></div>
          </div>
        </a>
        <a class="chat-item" href="#">
          <div class="avatar avatar-four">A</div>
          <div class="chat-info">
            <div class="chat-line"><strong>Ali</strong><time>Monday</time></div>
            <div class="preview-line"><span>Okay, phir milte hain.</span></div>
          </div>
        </a>
      </div>
      <footer class="side-footer">🔒 Your chats stay yours</footer>
    </aside>
    <section class="conversation">
      <header class="chat-header">
        <div class="contact-heading">
          <div class="avatar contact large">A<i></i></div>
          <div>
            <h1>Ayaan</h1>
            <p><span class="online"></span> online</p>
          </div>
        </div>
        <div class="header-buttons"><button class="header-icon" aria-label="Video call">▣</button><button
            class="header-icon" aria-label="Voice call">☎</button><button class="header-icon"
            aria-label="More options">⋮</button></div>
      </header>
      <div class="messages" id="messages">
      
      </div>

      <footer class="composer-area">
        <div class="composer">
          <button class="compose-icon" type="button" aria-label="Add attachment">＋</button>

          <button class="compose-icon" type="button" aria-label="Emoji">☺</button>

          <input type="text" class="message-input" id="message-input" placeholder="Type a message..." aria-label="Type a message" />

          <button class="mic" id="sender-btn" type="button" aria-label="Voice message"><i class="fa-solid fa-circle-arrow-up"></i></button>
        </div>

        <p class="footer-hint">
          Liqa <span>•</span> simple conversations, closer connections
        </p>
      </footer>

    </section>
  </main>




  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
  <script type="module" src="js/user1.js"></script>
</body>

</html>
